<style>
  :root{
    --bg:#0E1620;
    --panel:#2a4969;
    --panel-2:#1C2731;
    --ink:#F1ECE2;
    --muted:#8A97A3;
    --hair:#26323D;
    --gold:#E3A857;
    --gold-dim:#4A3C24;
    --cyan:#4FB6C4;
    --cyan-dim:#1F3A3E;
    --whatsapp:#3FB27F;
    --danger:#D9694F;
    --radius:22px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(227,168,87,0.08), transparent 60%),
      radial-gradient(1200px 600px at 85% 110%, rgba(79,182,196,0.08), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans Hebrew','IBM Plex Mono',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:28px 16px 60px;
  }
  .app{width:100%;max-width:760px;}

  .head{text-align:center;margin-bottom:26px;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:.18em;
    color:var(--muted);
    text-transform:uppercase;
  }
  h1{
    font-size:30px;
    font-weight:700;
    margin:6px 0 4px;
    letter-spacing:-0.01em;
  }
  .sub{color:var(--muted);font-size:14px;}

  .panels{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    gap:14px;
    align-items:stretch;
    margin-top:26px;
  }
  @media (max-width:620px){
    body{zoom:0.75;}
    .panels{grid-template-columns:1fr;}
    .divider{flex-direction:row;padding:6px 0;}
    .panel{padding:14px 14px 16px; gap:10px;}
    .mic-btn{width:72px;height:72px;}
    .mic-btn svg{width:26px;height:26px;}
    .mic-btn.recording.side-a{box-shadow:0 0 0 4px rgba(227,168,87,.35);}
    .mic-btn.recording.side-b{box-shadow:0 0 0 4px rgba(79,182,196,.35);}
    .transcript{max-height:88px; overflow-y:auto;}

  /* Distinct background per side, with enough contrast to stay readable */
  select.lang-select.select-a{

    border-color:var(--gold-dim);
    font-weight:600;
  }
  select.lang-select.select-b{
    background:var(--cyan-dim);
    color:var(--cyan);
    border-color:var(--cyan-dim);

  }
  /* Native dropdown list options: force readable dark text on light system
     background so they don't inherit the colored closed-state styling. */
  select.lang-select option{
    background:#fff;
    color:#111;
  }

  .mic-wrap{display:flex;justify-content:center;padding:6px 0 2px;}
  .mic-btn{
    width:104px;height:104px;
    border-radius:50%;
    border:none;

  @keyframes pulseGlowA {
    0% { transform: scale(1); }
    50% { transform: scale(1.06); }

</style>

<script>
// ============================================================
// PASTE YOUR GEMINI API KEY BELOW, between the quotes.
// Get one free at: https://aistudio.google.com/apikey
// Example: const EMBEDDED_API_KEY = "AIzaSyABCDEF1234567890abcdefgh";
// ============================================================
const EMBEDDED_API_KEY = "AQ.Ab8RN6Ir-waWTnvsPQTXpXdKzuPp3rGrxZKiXVfadGfE0SyOmg";

const LANGUAGES = [
  {code:'he-IL', name:'עברית', en:'Hebrew', flag:'🇮🇱'},
  {code:'en-US', name:'אנגלית', en:'English', flag:'🇺🇸'},
  {code:'ar-SA', name:'ערבית', en:'Arabic', flag:'🇸🇦'},
  {code:'ru-RU', name:'רוסית', en:'Russian', flag:'🇷🇺'},
  {code:'fr-FR', name:'צרפתית', en:'French', flag:'🇫🇷'},
  {code:'es-ES', name:'ספרדית', en:'Spanish', flag:'🇪🇸'},
  {code:'de-DE', name:'גרמנית', en:'German', flag:'🇩🇪'},
  {code:'it-IT', name:'איטלקית', en:'Italian', flag:'🇮🇹'},
  {code:'pt-PT', name:'פורטוגזית', en:'Portuguese', flag:'🇵🇹'},
  {code:'zh-CN', name:'סינית (מנדרין)', en:'Chinese (Mandarin)', flag:'🇨🇳'},
  {code:'ja-JP', name:'יפנית', en:'Japanese', flag:'🇯🇵'},
  {code:'hi-IN', name:'הינדי', en:'Hindi', flag:'🇮🇳'},
  {code:'am-ET', name:'אמהרית', en:'Amharic', flag:'🇪🇹'},
  {code:'tr-TR', name:'טורקית', en:'Turkish', flag:'🇹🇷'},
];

const state = {
  langA: 'he-IL',
  langB: 'en-US',
  isRecording: false,
  activeSide: null,
  stoppingSide: null,
  // Not shown in the UI — a small rolling buffer of recent exchanges kept
  // only so the translation model has conversational context (pronouns,
  // topic continuity). Capped at a few entries; never rendered.
  contextBuffer: [],
  // The single most recent translation — this is what the share button
  // sends. Each new translation replaces it; we don't keep a visible list.
  latest: null,
  finalTranscript: '',
  interimTranscript: '',
  committed: '',
  finishTimer: null,
  currentRecognition: null,
};

const els = {
  selectA: document.getElementById('selectA'),
  selectB: document.getElementById('selectB'),
  micA: document.getElementById('micA'),
  micB: document.getElementById('micB'),
  hintA: document.getElementById('hintA'),
  hintB: document.getElementById('hintB'),
  liveA: document.getElementById('liveA'),
  liveB: document.getElementById('liveB'),
  status: document.getElementById('status'),
  shareLatest: document.getElementById('shareLatest'),
  googleA: document.getElementById('googleA'),
  googleB: document.getElementById('googleB'),
};

function openGoogleSearch(liveEl){
  const text = liveEl.textContent.trim();
  if(!text) return;
  window.open(`https://www.google.com/search?q=${encodeURIComponent(text)}`, '_blank');
}
els.googleA.addEventListener('click', ()=> openGoogleSearch(els.liveA));
els.googleB.addEventListener('click', ()=> openGoogleSearch(els.liveB));

function populateSelect(sel, selected){
  LANGUAGES.forEach(l=>{
    const opt = document.createElement('option');
    opt.value = l.code;
    opt.textContent = `${l.flag} ${l.en} - ${l.name}`;
    if(l.code===selected) opt.selected = true;
    sel.appendChild(opt);
  });
}
populateSelect(els.selectA, state.langA);
populateSelect(els.selectB, state.langB);

function langName(code){
  const f = LANGUAGES.find(l=>l.code===code);
  return f ? f.name : code;
}

els.selectA.addEventListener('change', e=> state.langA = e.target.value);
els.selectB.addEventListener('change', e=> state.langB = e.target.value);

function setStatus(text, warn){
  els.status.textContent = text;
  els.status.classList.toggle('warn', !!warn);
}

const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;

// ---------- Recording engine ----------
// IMPORTANT: a NEW recognizer is created for every press (instead of reusing
// one long-lived instance). Reusing a single instance across start/stop
// cycles is known to misbehave on several Android Chrome versions —
// results silently stop arriving, especially after switching languages.
// A fresh instance per press is far more reliable.

let finalized = true;

function createRecognizer(side, liveEl, hintEl, micEl){
  const rec = new SpeechRecognitionAPI();
  rec.lang = side === 'a' ? state.langA : state.langB;
  rec.continuous = true;
  rec.interimResults = true;

  rec.onstart = () => {
    setStatus(side === 'a' ? 'מקשיב בשפה א… דברו עכשיו' : 'מקשיב בשפה ב… דברו עכשיו');
  };

  rec.onspeechstart = () => {
    setStatus('זיהיתי קול — ממשיך להקשיב…');
  };

  rec.onresult = (event) => {
    // Rebuild fresh from THIS instance's own results every time. Some
    // Android speech engines emit multiple "final" checkpoints that are
    // each CUMULATIVE (the whole sentence-so-far, not just the new bit) —
    // naively concatenating every final segment with += snowballs into
    // runaway duplication ("זה זה בעצם זה בעצם צפוי..."). To handle this
    // correctly regardless of which behavior a given browser/device uses,
    // we merge smartly: if a new final chunk is a longer version of what
    // we already have, REPLACE (it's cumulative); if it's shorter/already
    // contained, ignore it (stale); otherwise, it's genuinely new content
    // so append it.
    let finalPart = '';
    let interimPart = '';
    for(let i = 0; i < event.results.length; i++){
      const transcript = event.results[i][0].transcript;
      if(event.results[i].isFinal){
        const t = transcript.trim();
        const cur = finalPart.trim();
        if(!t) continue;
        if(cur === '' || t.startsWith(cur)){
          finalPart = t + ' ';               // cumulative superset — replace
        } else if(cur.startsWith(t)){
          // stale/shorter duplicate of what we already have — ignore
        } else {
          finalPart = (cur + ' ' + t).trim() + ' '; // genuinely new content
        }
      } else {
        interimPart += transcript;
      }
    }
    state.finalTranscript = (state.committed + finalPart);
    state.interimTranscript = interimPart;

    // Don't render the growing live text at all — while you keep talking,
    // each update naturally shows "everything said so far", which visually
    // reads like repetition even though nothing is actually wrong. Just
    // show a listening indicator instead; the real sentence appears once,
    // cleanly, after you release the button.
    liveEl.textContent = 'מקשיב… (דברו, ושחררו כשתסיימו)';
  };

  rec.onerror = (e) => {
    console.error('Speech error', e.error);
    if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
      setStatus('הגישה למיקרופון נחסמה — בדקו הרשאות באתר', true);
    } else if(e.error === 'audio-capture'){
      setStatus('לא נמצא מיקרופון זמין', true);
    } else if(e.error === 'network'){
      setStatus('בעיית רשת מול שירות זיהוי הדיבור — נסו שוב', true);
    } else if(e.error !== 'no-speech' && e.error !== 'aborted'){
      setStatus('שגיאת זיהוי דיבור: ' + e.error, true);
    }
  };

  rec.onend = () => {
    if(!state.isRecording && state.currentRecognition === rec){
      finalizeRecording(side, micEl, hintEl, liveEl);
    } else if(state.isRecording && state.currentRecognition === rec){
      // Browser auto-stopped (silence timeout) while button still held.
      // Commit whatever THIS instance finalized so far, then create a
      // genuinely NEW recognizer instance (not rec.start() again on the
      // same object) — some Android Chrome builds don't reset their
      // internal results list on restart, which combined with carrying
      // text over ourselves caused words to be double counted.
      state.committed = state.finalTranscript;
      const newRec = createRecognizer(side, liveEl, hintEl, micEl);
      state.currentRecognition = newRec;
      try{ newRec.start(); }catch(err){}
    }
  };

  return rec;
}

function startRecording(side){
  if(!SpeechRecognitionAPI){
    setStatus('זיהוי דיבור אינו נתמך בדפדפן זה', true);
    return;
  }
  if(state.isRecording) return;

  finalized = false;
  state.isRecording = true;
  state.activeSide = side;
  state.finalTranscript = '';
  state.interimTranscript = '';
  state.committed = '';
  window.speechSynthesis && window.speechSynthesis.cancel();

  const liveEl = side === 'a' ? els.liveA : els.liveB;
  const otherLiveEl = side === 'a' ? els.liveB : els.liveA;
  const hintEl = side === 'a' ? els.hintA : els.hintB;
  const micEl = side === 'a' ? els.micA : els.micB;

  liveEl.classList.remove('empty');
  liveEl.textContent = 'מקשיב… (דברו, ושחררו כשתסיימו)';
  otherLiveEl.textContent = 'כאן יופיע מה שנאמר…';
  otherLiveEl.classList.add('empty');
  otherLiveEl.classList.remove('result-a', 'result-b');

  // Both boxes are about to be overwritten (this side with the new
  // recording, the other side will be cleared) — disable search until
  // there's real text again.
  els.googleA.disabled = true;
  els.googleB.disabled = true;

  hintEl.textContent = 'שחרר לסיום ותרגום';
  micEl.classList.add('recording');
  setStatus(side === 'a' ? 'מפעיל מיקרופון (שפה א)…' : 'מפעיל מיקרופון (שפה ב)…');

  const rec = createRecognizer(side, liveEl, hintEl, micEl);
  state.currentRecognition = rec;

  try {
    rec.start();
  } catch(e) {
    state.isRecording = false;
    micEl.classList.remove('recording');
    setStatus('שגיאה בהפעלת מיקרופון', true);
  }
}

function stopRecording(side){
  if(!state.isRecording || state.activeSide !== side) return;
  if(state.stoppingSide === side) return; // stop already scheduled — ignore duplicate release events
  state.stoppingSide = side;

  // Keep actively listening for a brief moment after release — releasing
  // right as you finish the last word can otherwise cut it off before the
  // recognizer has captured it.
  const hintEl = side === 'a' ? els.hintA : els.hintB;
  hintEl.textContent = 'רגע… מוודא שנקלט הכל';
  setStatus('רגע אחד, מוודא שנקלטה המילה האחרונה…');

  setTimeout(()=>{
    state.stoppingSide = null;
    actuallyStopRecording(side);
  }, 500);
}

function actuallyStopRecording(side){
  if(!state.isRecording || state.activeSide !== side) return;
  state.isRecording = false;

  const micEl = side === 'a' ? els.micA : els.micB;
  const hintEl = side === 'a' ? els.hintA : els.hintB;
  const liveEl = side === 'a' ? els.liveA : els.liveB;

  micEl.classList.remove('recording');
  hintEl.textContent = 'מעבד…';
  setStatus('מסיים הקלטה…');

  const rec = state.currentRecognition;
  if(rec){
    try{ rec.stop(); }catch(e){}
  }

  // Safety net: if onend never fires for some reason, don't hang forever —
  // finalize with whatever we have after a short grace period.
  clearTimeout(state.finishTimer);
  state.finishTimer = setTimeout(()=>{
    finalizeRecording(side, micEl, hintEl, liveEl);
  }, 1500);
}

function finalizeRecording(side, micEl, hintEl, liveEl){
  if(finalized) return;
  finalized = true;
  clearTimeout(state.finishTimer);
  hintEl.textContent = 'החזק כדי לדבר';
  state.activeSide = null;
  state.currentRecognition = null;

  const text = (state.finalTranscript + state.interimTranscript).trim();
  state.finalTranscript = '';
  state.interimTranscript = '';

  if(!text){
    setStatus('לא זוהה דיבור — נסו לדבר קרוב יותר למיקרופון ולהחזיק את הכפתור קצת יותר זמן');
    liveEl.textContent = 'כאן יופיע מה שנאמר…';
    liveEl.classList.add('empty');
    return;
  }

  liveEl.textContent = text;
  (side === 'a' ? els.googleA : els.googleB).disabled = false;
  translateAndSpeak(text, side);
}

async function translateAndSpeak(sourceText, side){
  const apiKey = EMBEDDED_API_KEY;
  if(!apiKey || apiKey === "PASTE_YOUR_GEMINI_API_KEY_HERE"){
    setStatus('לא הוגדר מפתח API בקוד — פתחו את הקובץ ומלאו אותו ב-EMBEDDED_API_KEY', true);
    return;
  }

  if(state.translateInFlight){
    console.warn('translateAndSpeak called while a previous call is still in flight — skipping duplicate call.');
    setStatus('כבר מתבצע תרגום — המתינו…', true);
    return;
  }
  state.translateInFlight = true;

  // Diagnostic request log — lets us see exactly how many real API calls
  // are being fired, instead of guessing whether "quota reached" is real.
  const now = Date.now();
  state.requestLog = (state.requestLog || []).filter(t => now - t < 60000);
  state.requestLog.push(now);
  console.log(`[translate] request #${state.requestLog.length} in the last 60s, at ${new Date(now).toLocaleTimeString()}`);

  setStatus(`מתרגם חכם בהקשר השיחה… (בקשה מס' ${state.requestLog.length} בדקה האחרונה)`);
  const fromCode = side === 'a' ? state.langA : state.langB;
  const toCode = side === 'a' ? state.langB : state.langA;
  const fromName = langName(fromCode);
  const toName = langName(toCode);

  const contextLines = state.contextBuffer.slice(-6).map(h=>
    `${h.sourceLangName}: ${h.sourceText}\n${h.targetLangName}: ${h.targetText}`
  ).join('\n---\n');

  const systemPrompt = `אתה מנוע תרגום מקצועי, טבעי ורגיש להקשר. תרגם את המשפט האחרון מ-${fromName} ל-${toName}.
השתמש בהיסטוריית השיחה שסופקה (אם יש) כדי לשמור על עקביות.
החזר אך ורק את הטקסט המתורגם ב-${toName}, ללא הסברים, מירכאות או תגיות.`;

  const userPrompt = contextLines
    ? `הקשר שיחה קודם:\n${contextLines}\n---\nתרגם עכשיו:\n${sourceText}`
    : `תרגם:\n${sourceText}`;

  try{
    const model = "gemini-3.5-flash-lite";
    const response = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-goog-api-key": apiKey
        },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: systemPrompt }] },
          contents: [{ role: "user", parts: [{ text: userPrompt }] }]
        })
      }
    );

    if(response.status === 429){
      let detail = '';
      try{ const errJson = await response.json(); detail = errJson?.error?.message || ''; }catch(e){}
      console.error('429 detail:', detail);
      setStatus('חריגה ממכסה (429)' + (detail ? ': ' + detail : '') , true);
      return;
    }
    if(response.status === 404){
      setStatus('שגיאה 404: מודל התרגום לא נמצא או שכתובת ה-API שונתה.', true);
      return;
    }
    if(!response.ok){
      setStatus('שגיאה בתרגום מול גוגל (' + response.status + ')', true);
      return;
    }

    const data = await response.json();
    let translated = (data.candidates?.[0]?.content?.parts || [])
      .map(p => p.text || '').join('').trim();
    translated = translated.replace(/^["'"]|["'"]$/g,'').trim();

    if(!translated){
      setStatus('לא התקבל תרגום', true);
      return;
    }

    const targetLiveEl = side === 'a' ? els.liveB : els.liveA;
    targetLiveEl.classList.remove('empty');
    targetLiveEl.classList.add(side === 'a' ? 'result-b' : 'result-a');
    targetLiveEl.textContent = translated;
    (side === 'a' ? els.googleB : els.googleA).disabled = false;

    speak(translated, toCode);

    const entry = {
      side,
      sourceText, sourceLangName: fromName,
      targetText: translated, targetLangName: toName,
    };
    // Keep a small rolling context buffer (invisible, for translation
    // quality only) and separately track just the single latest
    // translation for sharing — no visible/growing history list.
    state.contextBuffer.push(entry);
    if(state.contextBuffer.length > 6) state.contextBuffer.shift();
    state.latest = entry;
    els.shareLatest.disabled = false;

    setStatus('מוכן להקשבה');
  }catch(err){
    console.error(err);
    setStatus('שגיאת תקשורת בתרגום — בדקו חיבור לרשת', true);
  }finally{
    state.translateInFlight = false;
  }
}

function speak(text, langCode){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = langCode;
  window.speechSynthesis.speak(utter);
}

function shareEntry(entry){
  if(!entry) return;
  window.open(`https://wa.me/?text=${encodeURIComponent(entry.targetText)}`, '_blank');
}

els.shareLatest.addEventListener('click', ()=> shareEntry(state.latest));

function setupHoldToTalk(btn, side) {
  const handleStart = (e) => {
    e.preventDefault();
    startRecording(side);
  };
  const handleEnd = (e) => {
    e.preventDefault();
    stopRecording(side);
  };

  if(window.PointerEvent){
    btn.addEventListener('pointerdown', (e)=>{
      try{ btn.setPointerCapture(e.pointerId); }catch(err){}
      handleStart(e);
    });
    btn.addEventListener('pointerup', handleEnd);
    btn.addEventListener('pointercancel', handleEnd);
  } else {
    btn.addEventListener('mousedown', handleStart);
    btn.addEventListener('mouseup', handleEnd);
    btn.addEventListener('mouseleave', handleEnd);
    btn.addEventListener('touchstart', handleStart, {passive: false});
    btn.addEventListener('touchend', handleEnd, {passive: false});
    btn.addEventListener('touchcancel', handleEnd, {passive: false});
  }
}

setupHoldToTalk(els.micA, 'a');
setupHoldToTalk(els.micB, 'b');

// Global fail-safes in case a release event never reaches the button itself.
window.addEventListener('pointerup', ()=>{ if(state.isRecording) stopRecording(state.activeSide); });
window.addEventListener('pointercancel', ()=>{ if(state.isRecording) stopRecording(state.activeSide); });
window.addEventListener('blur', ()=>{ if(state.isRecording) stopRecording(state.activeSide); });

if(!SpeechRecognitionAPI){
  setStatus('זיהוי דיבור אינו נתמך בדפדפן זה — מומלץ להשתמש ב־Chrome', true);
}
</script>
