<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אפליקציית תרגום חכם</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .phone-container {
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 800px;
            background-color: #ffffff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
            position: relative;
            border-radius: 30px;
        }

        header h1 {
            font-size: 1.4rem;
            color: #1a1a1a;
            text-align: center;
            margin-bottom: 20px;
        }

        .screen-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
            justify-content: center;
        }

        .text-card {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 16px;
            padding: 16px;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .text-card span.label {
            font-size: 0.8rem;
            color: #6c757d;
            font-weight: 600;
        }

        .text-card p.content {
            font-size: 1.1rem;
            color: #212529;
            margin-top: 8px;
        }

        .controls-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .language-buttons {
            display: flex;
            gap: 12px;
        }

        .btn-talk {
            flex: 1;
            padding: 18px 12px;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: bold;
            color: #ffffff;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .btn-talk:active {
            transform: scale(0.96);
        }

        .btn-he {
            background-color: #007aff;
        }

        .btn-en {
            background-color: #34c759;
        }

        .btn-whatsapp {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.2);
        }

        .btn-whatsapp:active {
            transform: scale(0.96);
        }

        .status-indicator {
            text-align: center;
            font-size: 0.85rem;
            color: #8e8e93;
            height: 20px;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <header>
            <h1>תרגום חכם בזמן אמת</h1>
        </header>

        <div class="screen-area">
            <div class="text-card">
                <div>
                    <span class="label">טקסט מקור</span>
                    <p class="content" id="sourceText">לחץ והחזק כפתור שפה כדי להתחיל לדבר...</p>
                </div>
            </div>

            <div class="text-card" style="background-color: #f0f7ff; border-color: #d0e1fd;">
                <div>
                    <span class="label">תרגום (בהתאמה להקשר)</span>
                    <p class="content" id="translatedText">התרגום יופיע כאן...</p>
                </div>
            </div>
        </div>

        <div class="status-indicator" id="statusIndicator">מוכן לשימוש</div>

        <div class="controls-area">
            <div class="language-buttons">
                <button class="btn-talk btn-he" id="btnHebrew">עברית (החזק)</button>
                <button class="btn-talk btn-en" id="btnEnglish">English (Hold)</button>
            </div>

            <button class="btn-whatsapp" id="btnShareWhatsApp">
                שתף בוואטסאפ
            </button>
        </div>
    </div>

</body>
</html>
